function limpiarPropuestasCanceladas(data) {
 var limpio = {};
 if (!data || typeof data !== 'object') return limpio;
 Object.keys(data).forEach(function(keyJornada) {
  var jornada = data[keyJornada];
  if (!jornada || typeof jornada !== 'object') return;
  limpio[keyJornada] = {};
  Object.keys(jornada).forEach(function(keyPartido) {
   var lista = Array.isArray(jornada[keyPartido]) ? jornada[keyPartido] : [];
   var filtrada = lista.filter(function(prop) {
    if (!prop || typeof prop !== 'object') return false;
    var estado = (prop.estado || '').toString().trim().toLowerCase();
    if (estado === 'rechazado' || estado === 'cancelado' || estado === 'cancelada') return false;
    if (!prop.jugador || !prop.equipo) return false;
    return true;
   });
   if (filtrada.length > 0) limpio[keyJornada][keyPartido] = filtrada;
  });
 });
 return limpio;
}
function cargarPropuestasPublicas() {
 fetch('https://api.github.com/repos/CarlosSD12345/liga-veteranos-valles/contents/propuestas.json?t=' + Date.now())
 .then(function(r) {
  if (r.status === 404) { propuestas = {}; renderizarRankingGoleadores(); return; }
  return r.json();
 })
 .then(function(data) {
  if (data && data.content) { propuestas = limpiarPropuestasCanceladas(JSON.parse(decodeURIComponent(escape(atob(data.content))))); }
  else if (data && typeof data === 'object' && !data.content) { propuestas = limpiarPropuestasCanceladas(data); }
  else { propuestas = {}; }
  renderizarRankingGoleadores();
 })
 .catch(function(e) { console.error(e); propuestas = {}; renderizarRankingGoleadores(); });
}
function renderizarRankingGoleadores() {
 var stats = {};
 for (var j in propuestas) {
  for (var p in propuestas[j]) {
   propuestas[j][p].forEach(function(prop) {
    if (prop.estado === 'aprobado') {
     var key = prop.jugador.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '') + '|' + prop.equipo.toLowerCase().trim().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
     if (!stats[key]) stats[key] = { jugador: prop.jugador, equipo: prop.equipo, goles: 0 };
     stats[key].goles += prop.goles;
    }
   });
  }
 }
 var lista = [];
 for (var k in stats) lista.push(stats[k]);
 lista.sort(function(a, b) { return b.goles - a.goles; });
 var html = '';
 lista.forEach(function(g, i) {
  var rankHtml = '';
  if (i === 0) rankHtml = '<span class="badge-form medalla-oro">🥇</span>';
  else if (i === 1) rankHtml = '<span class="badge-form medalla-plata">🥈</span>';
  else if (i === 2) rankHtml = '<span class="badge-form medalla-bronce">🥉</span>';
  else rankHtml = (i+1);
  html += '<tr><td>' + rankHtml + '</td><td class="team" style="font-weight:bold;">' + g.jugador + '</td><td>' + getNombreCorto(g.equipo) + '</td><td style="font-weight:bold; color:#2ecc71; font-size:1.1rem;">' + g.goles + '</td></tr>';
 });
 if (lista.length === 0) html = '<tr><td colspan="4" style="padding:30px; color:#a3b8af;">Aún no hay goles aprobados</td></tr>';
 document.getElementById('tabla-goleadores').innerHTML = html;
}

 var local = bloquePartido.substring(0, idxVs).trim();

 var matchEquipo = texto.match(/Equipo:\s*(.+?)(?:\n|$)/);

 var jornada = calendario.find(function(j) { return j.jornada === numJornada; });
 if (!jornada) { alert('Jornada ' + numJornada + ' no encontrada'); return; }
 function normalizarTexto(str) {
  return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/l·l/gi, 'l').replace(/ç/gi, 'c').replace(/[^a-z0-9\s]/g, '').toLowerCase().trim();
 }
 var idxPartido = -1;
 jornada.partidos.forEach(function(p, idx) {

     idxPartido = idx;

   }
  }
 });
 if (idxPartido === -1) { alert('Partido no encontrado: "' + textoPartido + '"\nRevisa que los nombres coincidan.'); return; }
 var goleadores = [];

 for (var i = 0; i < lineas.length; i++) {

 function similitudEquipos(a, b) {
  var norm = function(s) { return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, ''); };
  var aNorm = norm(a);

  var comunes = 0;
  var i = 0, j = 0;
  while (i < aNorm.length && j < bNorm.length) {
   if (aNorm[i] === bNorm[j]) { comunes++; i++; j++; }
   else { j++; }
  }
  return comunes;
 }
 var simLocal = similitudEquipos(equipo, partidoOrig.local);

 goleadores.forEach(function(g) {

 var token = localStorage.getItem('github_token');
