<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Veteranos Vallès</title>
    <style>
        body { background-color: #0b1d15; color: white; padding: 20px; font-family: Arial, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .badge { background-color: #2ecc71; color: #0b1d15; padding: 8px 20px; border-radius: 20px; font-weight: bold; display: inline-block; }
        .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; }
        .tab-btn { background-color: #11291e; color: #a3b8af; border: 1px solid #1f4733; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1rem; }
        .tab-btn.active { background-color: #2ecc71; color: #0b1d15; border-color: #2ecc71; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; background-color: #11291e; border-radius: 12px; overflow: hidden; }
        th { background-color: #173827; padding: 12px; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #1f4733; text-align: center; }
        .team { text-align: left; padding-left: 15px; }
        .team-info { display: flex; align-items: center; gap: 10px; }
        .team-logo { width: 44px; height: 44px; object-fit: contain; background: #ffffff; border-radius: 10px; padding: 2px; flex-shrink: 0; }
        .pts { font-weight: bold; color: #2ecc71; }
        .badge-form { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin: 0 2px; }
        .win { background-color: #27ae60; }
        .draw { background-color: #f39c12; }
        .loss { background-color: #c0392b; }
        .none { background-color: #7f8c8d; }
        .suspended { background-color: #3498db; }
        .rest { background-color: #9b59b6; }
        .col-forma { white-space: nowrap; min-width: 90px; }
        .selector-container { margin-bottom: 20px; text-align: center; }
        #selector-jornada, #admin-selector-jornada { background-color: #11291e; color: white; border: 1px solid #2ecc71; padding: 12px 20px; border-radius: 8px; font-size: 1rem; font-weight: bold; width: 100%; max-width: 350px; cursor: pointer; }
        .match-card { background-color: #11291e; border: 1px solid #1f4733; border-radius: 10px; padding: 15px; margin-bottom: 10px; }
        .match-teams { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 10px; }
        .match-team { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; }
        .match-team.local { justify-content: flex-end; text-align: right; }
        .match-team.visitante { justify-content: flex-start; text-align: left; }
        .match-team img { width: 44px; height: 44px; object-fit: contain; background: #fff; border-radius: 8px; padding: 2px; flex-shrink: 0; }
        .match-team span { font-size: 0.8rem; font-weight: 600; line-height: 1.25; flex: 1; min-width: 0; }
        .match-score { background-color: #173827; padding: 10px 14px; border-radius: 8px; font-weight: bold; font-size: 1.3rem; color: #2ecc71; min-width: 70px; text-align: center; flex-shrink: 0; }
        .match-score.vs { color: #a3b8af; font-size: 0.9rem; }
        .match-info { font-size: 0.75rem; color: #a3b8af; text-align: center; border-top: 1px solid #1f4733; padding-top: 8px; }
        .suspended-banner { background-color: #e74c3c; color: white; padding: 15px; border-radius: 10px; text-align: center; font-weight: bold; margin-bottom: 20px; font-size: 1.1rem; }
        .descanso-banner { background-color: #173827; color: #a3b8af; padding: 12px; border-radius: 10px; text-align: center; margin-bottom: 15px; font-size: 0.95rem; border: 1px solid #1f4733; }
        footer { text-align: center; padding: 30px; color: #a3b8af; font-size: 0.85rem; border-top: 1px solid #1f4733; margin-top: 40px; }
        #admin-btn { background: none; border: none; color: #1f4733; font-size: 1.2rem; cursor: pointer; padding: 5px; }
        #admin-btn:hover { color: #2ecc71; }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .match-card { padding: 10px; }
            .match-teams { gap: 5px; }
            .match-team { gap: 5px; }
            .match-team img { width: 34px; height: 34px; }
            .match-team span { font-size: 0.78rem; }
            .match-score { min-width: 56px; padding: 8px 8px; font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VETERANOS VALLÈS</h1>
            <div class="badge" id="badge-jornada">JORNADA 4 · CLASIFICACIÓN</div>
        </header>
        <div class="tabs">
            <button class="tab-btn active" onclick="cambiarPestana('clasificacion', this)">Clasificación</button>
            <button class="tab-btn" onclick="cambiarPestana('calendario', this)">Calendario</button>
        </div>
        <div id="clasificacion" class="section active">
            <table>
                <thead>
                    <tr><th>#</th><th class="team">Equipo</th><th>PJ</th><th>PTS</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DIF</th><th>3 ÚLTIMOS</th></tr>
                </thead>
                <tbody id="tabla"></tbody>
            </table>
        </div>
        <div id="calendario" class="section">
            <div class="selector-container">
                <select id="selector-jornada" onchange="cargarJornada()"></select>
            </div>
            <div id="contenedor-partidos"></div>
        </div>
        <footer>
            <p>© 2026 Liga de Fútbol Veteranos del Vallès</p>
            <button id="admin-btn" onclick="abrirAdmin()" style="background-color: #11291e; color: #2ecc71; border: 1px solid #2ecc71; padding: 10px 20px; border-radius: 8px; font-size: 0.9rem; font-weight: bold; cursor: pointer; margin-top: 10px;">⚙️ Admin</button>
        </footer>
    </div>

    <div id="panel-admin" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(11, 29, 21, 0.98); z-index: 9999; padding: 20px; box-sizing: border-box; overflow-y: auto;">
        <div style="max-width: 400px; margin: 30px auto; background-color: #11291e; padding: 25px; border-radius: 12px; border: 1px solid #2ecc71; text-align: center;">
            <div id="pantalla-codigo">
                <h2 style="color: #2ecc71; margin-bottom: 20px;">🔒 Acceso Restringido</h2>
                <input type="password" id="codigo-admin" placeholder="Código..." style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1f4733; background-color: #0b1d15; color: white; font-size: 16px; text-align: center;">
                <button onclick="verificarCodigo()" style="width: 100%; padding: 12px; background-color: #2ecc71; color: #0b1d15; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px;">Entrar</button>
                <button onclick="cerrarAdmin()" style="width: 100%; padding: 12px; background-color: transparent; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Cancelar</button>
            </div>
            <div id="pantalla-token" style="display: none;">
                <h2 style="color: #2ecc71; margin-bottom: 10px;">⚙️ Configuración</h2>
                <p style="color: #a3b8af; margin-bottom: 15px; font-size: 0.9rem;">Pega aquí tu Token de GitHub:</p>
                <input type="password" id="input-token" placeholder="ghp_..." style="width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #1f4733; background-color: #0b1d15; color: white; font-size: 14px; text-align: center;">
                <button onclick="guardarToken()" style="width: 100%; padding: 12px; background-color: #2ecc71; color: #0b1d15; border: none; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px;">Guardar Token</button>
                <button onclick="cerrarAdmin()" style="width: 100%; padding: 12px; background-color: transparent; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer;">Cancelar</button>
            </div>
            <div id="pantalla-control" style="display: none;">
                <h2 style="color: #2ecc71; margin-bottom: 20px;">🎛️ Panel de Control</h2>
                <p style="color: #a3b8af; margin-bottom: 15px;">Selecciona la jornada para editar los resultados:</p>
                <select id="admin-selector-jornada" onchange="mostrarPartidosAdmin()" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #1f4733; background-color: #0b1d15; color: white; font-size: 16px;">
                    <option value="">Selecciona Jornada...</option>
                </select>
                <div id="admin-partidos-container"></div>
                <button onclick="cerrarAdmin()" style="width: 100%; padding: 12px; background-color: transparent; color: #e74c3c; border: 1px solid #e74c3c; border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 20px;">Salir</button>
            </div>
        </div>
    </div>

    <script>
        function cambiarPestana(id, btn) {
            document.querySelectorAll('.section').forEach(function(s) { s.classList.remove('active'); });
            document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
            if (id === 'calendario') initCalendario();
        }

        function abrirAdmin() {
            document.getElementById('panel-admin').style.display = 'block';
            document.getElementById('codigo-admin').value = '';
            if (localStorage.getItem('github_token')) {
                mostrarControl();
            } else {
                document.getElementById('pantalla-codigo').style.display = 'block';
                document.getElementById('pantalla-token').style.display = 'none';
                document.getElementById('pantalla-control').style.display = 'none';
            }
        }
        function cerrarAdmin() {
            document.getElementById('panel-admin').style.display = 'none';
        }
        function verificarCodigo() {
            var codigo = document.getElementById('codigo-admin').value;
            if (codigo === '46602900') {
                document.getElementById('pantalla-codigo').style.display = 'none';
                document.getElementById('pantalla-token').style.display = 'block';
            } else {
                alert('Código incorrecto.');
            }
        }
        function guardarToken() {
            var token = document.getElementById('input-token').value.trim();
            if (token.length > 10) {
                localStorage.setItem('github_token', token);
                alert('Token guardado correctamente.');
                mostrarControl();
            } else {
                alert('El token no parece válido.');
            }
        }
        function mostrarControl() {
            document.getElementById('pantalla-codigo').style.display = 'none';
            document.getElementById('pantalla-token').style.display = 'none';
            document.getElementById('pantalla-control').style.display = 'block';
            cargarSelectorAdmin();
        }
        function cargarSelectorAdmin() {
            var select = document.getElementById('admin-selector-jornada');
            select.innerHTML = '<option value="">Selecciona Jornada...</option>';
            calendario.forEach(function(j) {
                var opt = document.createElement('option');
                opt.value = j.jornada;
                opt.text = 'Jornada ' + j.jornada;
                select.appendChild(opt);
            });
        }
        function mostrarPartidosAdmin() {
            var numJornada = parseInt(document.getElementById('admin-selector-jornada').value);
            var contenedor = document.getElementById('admin-partidos-container');
            contenedor.innerHTML = '';
            if (!numJornada) return;
            var jornada = null;
            for (var i = 0; i < calendario.length; i++) {
                if (calendario[i].jornada === numJornada) { jornada = calendario[i]; break; }
            }
            if (!jornada) return;
            var html = '<h3 style="color:white; margin-bottom:15px;">Jornada ' + jornada.jornada + '</h3>';
            jornada.partidos.forEach(function(p, index) {
                var checked = p.suspendido ? 'checked' : '';
                html += '<div style="background:#0b1d15; padding:10px; border-radius:8px; margin-bottom:10px; border:1px solid #1f4733;">';
                html += '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">';
                html += '<span style="color:white; font-size:0.85rem; flex:1; text-align:right; padding-right:10px;">' + getNombreCorto(p.local) + '</span>';
                html += '<input type="number" id="gol-local-' + index + '" value="' + (p.golesLocal !== null ? p.golesLocal : '') + '" inputmode="numeric" style="width:40px; text-align:center; padding:5px; border-radius:4px; border:1px solid #2ecc71; background:#11291e; color:white; font-size:16px;">';
                html += '<span style="color:#2ecc71; margin:0 5px;">-</span>';
                html += '<input type="number" id="gol-visitante-' + index + '" value="' + (p.golesVisitante !== null ? p.golesVisitante : '') + '" inputmode="numeric" style="width:40px; text-align:center; padding:5px; border-radius:4px; border:1px solid #2ecc71; background:#11291e; color:white; font-size:16px;">';
                html += '<span style="color:white; font-size:0.85rem; flex:1; text-align:left; padding-left:10px;">' + getNombreCorto(p.visitante) + '</span>';
                html += '</div>';
                html += '<div style="text-align:center; margin-top:8px;">';
                html += '<label style="color:#3498db; font-size:0.8rem; cursor:pointer;"><input type="checkbox" id="suspendido-' + index + '" ' + checked + '> ⏸️ Partido Suspendido</label>';
                html += '</div></div>';
            });
            html += '<button id="btn-guardar" onclick="guardarResultados(' + numJornada + ')" style="width:100%; padding:12px; background-color:#2ecc71; color:#0b1d15; border:none; border-radius:8px; font-weight:bold; font-size:16px; cursor:pointer; margin-top:15px;">💾 Guardar Resultados en la Web</button>';
            contenedor.innerHTML = html;
        }

        function guardarResultados(jornadaNum) {
            var btn = document.getElementById('btn-guardar');
            btn.textContent = '⏳ Obteniendo archivo...';
            btn.disabled = true;
            var token = localStorage.getItem('github_token');
            var jornada = null;
            for (var i = 0; i < calendario.length; i++) {
                if (calendario[i].jornada === jornadaNum) { jornada = calendario[i]; break; }
            }
            jornada.partidos.forEach(function(p, index) {
                var valLocal = document.getElementById('gol-local-' + index).value;
                var valVisitante = document.getElementById('gol-visitante-' + index).value;
                var isSuspendido = document.getElementById('suspendido-' + index).checked;
                p.suspendido = isSuspendido;
                if (isSuspendido) {
                    p.golesLocal = null;
                    p.golesVisitante = null;
                } else {
                    p.golesLocal = valLocal === '' ? null : parseInt(valLocal);
                    p.golesVisitante = valVisitante === '' ? null : parseInt(valVisitante);
                }
            });

            fetch('https://api.github.com/repos/CarlosSD12345/liga-veteranos-valles/contents/index.html', {
                headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json' }
            })
            .then(function(response) { return response.json(); })
            .then(function(data) {
                if (!data.sha) throw new Error('No se pudo obtener el SHA del archivo');
                var shaActual = data.sha;
                var contenidoBase64 = data.content;
                var contenidoActual = atob(contenidoBase64);

                btn.textContent = '⏳ Guardando...';

                var inicioMarker = '/*CALENDARIO_START*/';
                var finMarker = '/*CALENDARIO_END*/';
                var inicioIdx = contenidoActual.indexOf(inicioMarker);
                var finIdx = contenidoActual.indexOf(finMarker);
                if (inicioIdx === -1 || finIdx === -1) {
                    throw new Error('No se encontraron los marcadores en el archivo');
                }
                var nuevoContenido = contenidoActual.substring(0, inicioIdx + inicioMarker.length) + '\nvar calendario = ' + JSON.stringify(calendario, null, 2) + ';\n' + contenidoActual.substring(finIdx);
                var base64Content = btoa(unescape(encodeURIComponent(nuevoContenido)));

                return fetch('https://api.github.com/repos/CarlosSD12345/liga-veteranos-valles/contents/index.html', {
                    method: 'PUT',
                    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github.v3+json', 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Actualización automática - Jornada ' + jornadaNum, content: base64Content, sha: shaActual })
                });
            })
            .then(function(response) {
                if (response.ok) {
                    alert('✅ ¡Resultados guardados con éxito! La web se recargará para mostrar los cambios.');
                    location.reload();
                } else {
                    return response.json().then(function(err) { throw new Error(err.message || 'Error al guardar'); });
                }
            })
            .catch(function(error) {
                alert('❌ Error: ' + error.message);
                btn.textContent = '💾 Guardar Resultados en la Web';
                btn.disabled = false;
            });
        }

            ], descanso: "A.V. L'Ametlla del Vallés" },
            { jornada: 34, fecha: "13/06/2027", suspendida: false, partidos: [
                { local: "Penya Decano", visitante: "U.D.A. Gramanet", golesLocal: null, golesVisitante: null, campo: "MPAL LA FERRERIA", hora: "08:00" },
                { local: "A.V. Ripollet", visitante: "U.E. Castellar", golesLocal: null, golesVisitante: null, campo: "MPAL RIPOLLET", hora: "08:00" },
                { local: "C.E. Sentmenat", visitante: "C.F. Sant Feliu de Codines", golesLocal: null, golesVisitante: null, campo: "MPAL SENTMENAT", hora: "08:30" },
                { local: "C.F. Cerdanyola", visitante: "E.F.B Palau Solitá i Plegamans", golesLocal: null, golesVisitante: null, campo: "MPAL FONTETAS", hora: "08:15" },
                { local: "C.F. Can Parellada", visitante: "U.E. Canovelles", golesLocal: null, golesVisitante: null, campo: "CAN PARELLADA", hora: "08:15" },
                { local: "C.F. Barberá", visitante: "A.V. L'Ametlla del Vallés", golesLocal: null, golesVisitante: null, campo: "MPAL BARBERA", hora: "08:00" },
                { local: "C.E. Bigues i Riells", visitante: "V.C.F. Ripollet", golesLocal: null, golesVisitante: null, campo: "MPAL BIGUES", hora: "08:15" },

            ], descanso: "A.V. Pallejá" }
        ];
        /*CALENDARIO_END*/

        var equipos = [
            { nombre: "Barberà", img: "barbera.png", nombreCompleto: "C.F. Barberá" },
            { nombre: "Can Parellada", img: "can_parellada.png", nombreCompleto: "C.F. Can Parellada" },
            { nombre: "Castellar", img: "castellar.png", nombreCompleto: "U.E. Castellar" },
            { nombre: "Santa Eulàlia", img: "sta_eulalia.png", nombreCompleto: "C.E. Santa Eulàlia de Ronçana" },
            { nombre: "L'Ametlla", img: "l_ametlla.png", nombreCompleto: "A.V. L'Ametlla del Vallés" },
            { nombre: "Sabadellenca", img: "sabadellenca.png", nombreCompleto: "U.E. Sabadellenca" },
            { nombre: "Cerdanyola", img: "cerdanyola.png", nombreCompleto: "C.F. Cerdanyola" },
            { nombre: "Penya Decano", img: "decano.png", nombreCompleto: "Penya Decano" },
            { nombre: "Pallejà", img: "palleja.png", nombreCompleto: "A.V. Pallejá" },
            { nombre: "A.V. Ripollet", img: "agrup_ripollet.png", nombreCompleto: "A.V. Ripollet" },
            { nombre: "Gramanet", img: "gramanet.png", nombreCompleto: "U.D.A. Gramanet" },
            { nombre: "Sentmenat", img: "sentmenat.png", nombreCompleto: "C.E. Sentmenat" },
            { nombre: "Sant Feliu", img: "st_feliu_codines.png", nombreCompleto: "C.F. Sant Feliu de Codines" },
            { nombre: "Palau Plegamans", img: "palau_plegamans.png", nombreCompleto: "E.F.B Palau Solitá i Plegamans" },
            { nombre: "Canovelles", img: "canovelles.png", nombreCompleto: "U.E. Canovelles" },
            { nombre: "VCF Ripollet", img: "vcf_ripollet.png", nombreCompleto: "V.C.F. Ripollet" },
            { nombre: "Bigues", img: "bigues.png", nombreCompleto: "C.E. Bigues i Riells" }
        ];

        function calcularClasificacion() {
            var stats = {};
            equipos.forEach(function(eq) {
                stats[eq.nombreCompleto] = { nombre: eq.nombre, img: eq.img, pj: 0, pts: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, forma: [] };
            });
            calendario.forEach(function(jornada) {
                var jornadaJugada = jornada.suspendida || jornada.partidos.some(function(p) {
                    return p.golesLocal !== null && p.golesVisitante !== null;
                });
                if (!jornadaJugada) return;
                equipos.forEach(function(eq) {
                    var nombre = eq.nombreCompleto;
                    if (jornada.suspendida) {
                        stats[nombre].forma.push('S');
                    } else if (jornada.descanso === nombre) {
                        stats[nombre].forma.push('D');
                    } else {
                        var partido = null;
                        for (var i = 0; i < jornada.partidos.length; i++) {
                            if (jornada.partidos[i].local === nombre || jornada.partidos[i].visitante === nombre) {
                                partido = jornada.partidos[i];
                                break;
                            }
                        }
                        if (partido && partido.golesLocal !== null && partido.golesVisitante !== null) {
                            var esLocal = partido.local === nombre;
                            var gp = esLocal ? partido.golesLocal : partido.golesVisitante;
                            var gr = esLocal ? partido.golesVisitante : partido.golesLocal;
                            stats[nombre].pj++;
                            stats[nombre].gf += gp;
                            stats[nombre].gc += gr;
                            if (gp > gr) { stats[nombre].pts += 3; stats[nombre].g++; stats[nombre].forma.push('G'); }
                            else if (gp < gr) { stats[nombre].p++; stats[nombre].forma.push('P'); }
                            else { stats[nombre].pts += 1; stats[nombre].e++; stats[nombre].forma.push('E'); }
                        }
                    }
                });
            });
            Object.keys(stats).forEach(function(key) {
                stats[key].dif = stats[key].gf - stats[key].gc;
                var ult = stats[key].forma.slice(-3);
                while (ult.length < 3) ult.unshift('-');
                stats[key].forma = ult;
            });
            return Object.values(stats).sort(function(a, b) {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dif !== a.dif) return b.dif - a.dif;
                return a.nombre.localeCompare(b.nombre);
            });
        }

        function renderizarClasificacion() {
            var clasificacion = calcularClasificacion();
            var html = '';
            clasificacion.forEach(function(eq, i) {
                var formaHtml = '';
                for (var j = 0; j < 3; j++) {
                    var letra = eq.forma[j] || '-';
                    var clase = 'none';
                    if (letra === 'G') clase = 'win';
                    else if (letra === 'E') clase = 'draw';
                    else if (letra === 'P') clase = 'loss';
                    else if (letra === 'S') clase = 'suspended';
                    else if (letra === 'D') clase = 'rest';
                    formaHtml += '<span class="badge-form ' + clase + '">' + letra + '</span>';
                }
                html += '<tr><td>' + (i+1) + '</td><td class="team"><div class="team-info"><img src="escudos/' + eq.img + '" class="team-logo" alt="' + eq.nombre + '">' + eq.nombre + '</div></td><td>' + eq.pj + '</td><td class="pts">' + eq.pts + '</td><td>' + eq.g + '</td><td>' + eq.e + '</td><td>' + eq.p + '</td><td>' + eq.gf + '</td><td>' + eq.gc + '</td><td>' + (eq.dif > 0 ? '+' + eq.dif : eq.dif) + '</td><td class="col-forma">' + formaHtml + '</td></tr>';
            });
            document.getElementById('tabla').innerHTML = html;
        }

        function getImgEquipo(nombreCompleto) {
            for (var i = 0; i < equipos.length; i++) {
                if (equipos[i].nombreCompleto === nombreCompleto) return equipos[i].img;
            }
            return '';
        }

        function getNombreCorto(nombreCompleto) {
            for (var i = 0; i < equipos.length; i++) {
                if (equipos[i].nombreCompleto === nombreCompleto) return equipos[i].nombre;
            }
            return nombreCompleto;
        }

        function initCalendario() {
            var selector = document.getElementById('selector-jornada');
            if (selector.options.length > 0) return;
            calendario.forEach(function(j) {
                var opt = document.createElement('option');
                opt.value = j.jornada;
                opt.text = 'Jornada ' + j.jornada + ' (' + j.fecha + ')';
                selector.appendChild(opt);
            });
            cargarJornada();
        }

        function cargarJornada() {
            var numJornada = parseInt(document.getElementById('selector-jornada').value);
            var jornada = null;
            for (var i = 0; i < calendario.length; i++) {
                if (calendario[i].jornada === numJornada) { jornada = calendario[i]; break; }
            }
            if (!jornada) return;
            var contenedor = document.getElementById('contenedor-partidos');
            var html = '';
            if (jornada.suspendida) {
                html += '<div class="suspended-banner">🌧️ JORNADA ' + jornada.jornada + ' SUSPENDIDA POR LLUVIA</div>';
            }
            if (jornada.descanso) {
                html += '<div class="descanso-banner">😴 Descansa: <strong>' + getNombreCorto(jornada.descanso) + '</strong></div>';
            }
            jornada.partidos.forEach(function(p) {
                var marcador = '';
                if (p.golesLocal !== null && p.golesVisitante !== null) {
                    marcador = '<div class="match-score">' + p.golesLocal + ' - ' + p.golesVisitante + '</div>';
                } else {
                    marcador = '<div class="match-score vs">VS</div>';
                }
                var arbitroHtml = p.arbitro ? ' · 👤 ' + p.arbitro : '';
                html += '<div class="match-card">';
                html += '<div class="match-teams">';
                html += '<div class="match-team local"><span>' + getNombreCorto(p.local) + '</span><img src="escudos/' + getImgEquipo(p.local) + '" alt="' + p.local + '"></div>';
                html += marcador;
                html += '<div class="match-team visitante"><img src="escudos/' + getImgEquipo(p.visitante) + '" alt="' + p.visitante + '"><span>' + getNombreCorto(p.visitante) + '</span></div>';
                html += '</div>';
                html += '<div class="match-info">📍 ' + p.campo + ' · 🕒 ' + p.hora + ' · 📅 ' + jornada.fecha + arbitroHtml + '</div>';
                html += '</div>';
            });
            contenedor.innerHTML = html;
        }

        window.onload = function() {
            renderizarClasificacion();
        };
    </script>
