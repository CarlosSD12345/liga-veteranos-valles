<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liga Veteranos Vallès</title>
    <style>
        body { background-color: #0b1d15; color: white; padding: 20px; font-family: Arial, sans-serif; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 25px; }
        .badge { background-color: #2ecc71; color: #0b1d15; padding: 8px 20px; border-radius: 20px; font-weight: bold; display: inline-block; }
        table { width: 100%; border-collapse: collapse; background-color: #11291e; border-radius: 12px; overflow: hidden; }
        th { background-color: #173827; padding: 12px; text-align: center; }
        td { padding: 12px; border-bottom: 1px solid #1f4733; text-align: center; white-space: nowrap; }
        .team { text-align: left; padding-left: 15px; }
        .pts { font-weight: bold; color: #2ecc71; }
        .badge-form { display: inline-block; width: 22px; height: 22px; line-height: 22px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; margin: 0 2px; }
        .win { background-color: #27ae60; }
        .draw { background-color: #f39c12; }
        .loss { background-color: #c0392b; }
        .none { background-color: #7f8c8d; }
        .suspended { background-color: #3498db; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>VETERANOS VALLÈS</h1>
            <div class="badge">JORNADA 4 · CLASIFICACIÓN</div>
        </header>
        <table>
            <thead>
                <tr><th>#</th><th class="team">Equipo</th><th>PJ</th><th>PTS</th><th>G</th><th>E</th><th>P</th><th>GF</th><th>GC</th><th>DIF</th><th>3 ÚLTIMOS</th></tr>
            </thead>
            <tbody id="tabla"></tbody>
        </table>
    </div>

    <script>
        var calendario = [
            { jornada: 1, suspendida: false, partidos: [
                { local: "U.E. Sabadellenca", visitante: "V.C.F. Ripollet", golesLocal: 5, golesVisitante: 1 },
                { local: "C.E. Bigues i Riells", visitante: "A.V. L'Ametlla del Vallés", golesLocal: 3, golesVisitante: 16 },
                { local: "C.F. Barberá", visitante: "A.V. Pallejá", golesLocal: 4, golesVisitante: 1 },
                { local: "C.F. Can Parellada", visitante: "E.F.B Palau Solitá i Plegamans", golesLocal: 6, golesVisitante: 3 },
                { local: "C.F. Cerdanyola", visitante: "C.F. Sant Feliu de Codines", golesLocal: 4, golesVisitante: 1 },
                { local: "C.E. Sentmenat", visitante: "U.E. Castellar", golesLocal: 2, golesVisitante: 5 },
                { local: "A.V. Ripollet", visitante: "U.D.A. Gramanet", golesLocal: 3, golesVisitante: 1 },
                { local: "C.E. Santa Eulàlia de Ronçana", visitante: "Penya Decano", golesLocal: 3, golesVisitante: 2 }
            ], descanso: "U.E. Canovelles" },
            { jornada: 2, suspendida: false, partidos: [
                { local: "V.C.F. Ripollet", visitante: "C.E. Santa Eulàlia de Ronçana", golesLocal: 3, golesVisitante: 5 },
                { local: "A.V. L'Ametlla del Vallés", visitante: "U.E. Sabadellenca", golesLocal: 4, golesVisitante: 4 },
                { local: "A.V. Pallejá", visitante: "C.E. Bigues i Riells", golesLocal: 5, golesVisitante: 1 },
                { local: "U.E. Canovelles", visitante: "C.F. Barberá", golesLocal: 1, golesVisitante: 4 },
                { local: "C.F. Sant Feliu de Codines", visitante: "C.F. Can Parellada", golesLocal: 2, golesVisitante: 3 },
                { local: "U.E. Castellar", visitante: "C.F. Cerdanyola", golesLocal: 3, golesVisitante: 2 },
                { local: "U.D.A. Gramanet", visitante: "C.E. Sentmenat", golesLocal: 2, golesVisitante: 2 },
                { local: "Penya Decano", visitante: "A.V. Ripollet", golesLocal: 6, golesVisitante: 3 }
            ], descanso: "E.F.B Palau Solitá i Plegamans" },
            { jornada: 3, suspendida: true, partidos: [], descanso: "C.F. Sant Feliu de Codines" },
            { jornada: 4, suspendida: false, partidos: [], descanso: "U.E. Castellar" }
        ];

        var equipos = [
            { nombre: "Barberà", nombreCompleto: "C.F. Barberá" },
            { nombre: "Can Parellada", nombreCompleto: "C.F. Can Parellada" },
            { nombre: "Castellar", nombreCompleto: "U.E. Castellar" },
            { nombre: "Santa Eulàlia", nombreCompleto: "C.E. Santa Eulàlia de Ronçana" },
            { nombre: "L'Ametlla", nombreCompleto: "A.V. L'Ametlla del Vallés" },
            { nombre: "Sabadellenca", nombreCompleto: "U.E. Sabadellenca" },
            { nombre: "Cerdanyola", nombreCompleto: "C.F. Cerdanyola" },
            { nombre: "Penya Decano", nombreCompleto: "Penya Decano" },
            { nombre: "Pallejà", nombreCompleto: "A.V. Pallejá" },
            { nombre: "A.V. Ripollet", nombreCompleto: "A.V. Ripollet" },
            { nombre: "Gramanet", nombreCompleto: "U.D.A. Gramanet" },
            { nombre: "Sentmenat", nombreCompleto: "C.E. Sentmenat" },
            { nombre: "Sant Feliu", nombreCompleto: "C.F. Sant Feliu de Codines" },
            { nombre: "Palau Plegamans", nombreCompleto: "E.F.B Palau Solitá i Plegamans" },
            { nombre: "Canovelles", nombreCompleto: "U.E. Canovelles" },
            { nombre: "VCF Ripollet", nombreCompleto: "V.C.F. Ripollet" },
            { nombre: "Bigues", nombreCompleto: "C.E. Bigues i Riells" }
        ];

        function calcularClasificacion() {
            var stats = {};
            equipos.forEach(function(eq) {
                stats[eq.nombreCompleto] = { nombre: eq.nombre, pj: 0, pts: 0, g: 0, e: 0, p: 0, gf: 0, gc: 0, forma: [] };
            });

            calendario.forEach(function(jornada) {
                equipos.forEach(function(eq) {
                    var nombre = eq.nombreCompleto;
                    if (jornada.suspendida) {
                        stats[nombre].forma.push('S');
                    } else if (jornada.descanso === nombre) {
                        stats[nombre].forma.push('-');
                    } else {
                        var partido = null;
                        for (var i = 0; i < jornada.partidos.length; i++) {
                            if (jornada.partidos[i].local === nombre || jornada.partidos[i].visitante === nombre) {
                                partido = jornada.partidos[i];
                                break;
                            }
                        }
                        if (partido && partido.golesLocal !== null && partido.golesVisitante !== null) {
                            var esLocal = partido.local === nombre;
                            var gp = esLocal ? partido.golesLocal : partido.golesVisitante;
                            var gr = esLocal ? partido.golesVisitante : partido.golesLocal;
                            stats[nombre].pj++;
                            stats[nombre].gf += gp;
                            stats[nombre].gc += gr;
                            if (gp > gr) { stats[nombre].pts += 3; stats[nombre].g++; stats[nombre].forma.push('G'); }
                            else if (gp < gr) { stats[nombre].p++; stats[nombre].forma.push('P'); }
                            else { stats[nombre].pts += 1; stats[nombre].e++; stats[nombre].forma.push('E'); }
                        } else {
                            stats[nombre].forma.push('-');
                        }
                    }
                });
            });

            Object.keys(stats).forEach(function(key) {
                stats[key].dif = stats[key].gf - stats[key].gc;
                var ult = stats[key].forma.slice(-3);
                while (ult.length < 3) ult.unshift('-');
                stats[key].forma = ult;
            });

            return Object.values(stats).sort(function(a, b) {
                if (b.pts !== a.pts) return b.pts - a.pts;
                if (b.dif !== a.dif) return b.dif - a.dif;
                return a.nombre.localeCompare(b.nombre);
            });
        }

        function renderizar() {
            var clasificacion = calcularClasificacion();
            var html = '';
            clasificacion.forEach(function(eq, i) {
                var formaHtml = '';
                for (var j = 0; j < 3; j++) {
                    var letra = eq.forma[j] || '-';
                    var clase = 'none';
                    if (letra === 'G') clase = 'win';
                    else if (letra === 'E') clase = 'draw';
                    else if (letra === 'P') clase = 'loss';
                    else if (letra === 'S') clase = 'suspended';
                    formaHtml += '<span class="badge-form ' + clase + '">' + letra + '</span>';
                }
                html += '<tr><td>' + (i+1) + '</td><td class="team">' + eq.nombre + '</td><td>' + eq.pj + '</td><td class="pts">' + eq.pts + '</td><td>' + eq.g + '</td><td>' + eq.e + '</td><td>' + eq.p + '</td><td>' + eq.gf + '</td><td>' + eq.gc + '</td><td>' + (eq.dif > 0 ? '+' + eq.dif : eq.dif) + '</td><td>' + formaHtml + '</td></tr>';
            });
            document.getElementById('tabla').innerHTML = html;
        }

        window.onload = renderizar;
    </script>
</body>
</html>
